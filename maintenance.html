<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance - UndiApp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .maintenance-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .gear-icon {
            font-size: 80px;
            color: #667eea;
            margin-bottom: 30px;
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .maintenance-title {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .maintenance-description {
            font-size: 18px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .progress-container {
            margin: 40px 0;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
            animation: loading 2s ease-in-out infinite;
        }

        @keyframes loading {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        .progress-text {
            font-size: 14px;
            color: #888;
        }

        .contact-info {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }

        .contact-info p {
            color: #888;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .contact-email {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .contact-email:hover {
            text-decoration: underline;
        }

        .refresh-info {
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
        }

        .app-logo {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .maintenance-container {
                padding: 40px 20px;
                margin: 20px;
            }
            
            .maintenance-title {
                font-size: 36px;
            }
            
            .gear-icon {
                font-size: 60px;
            }
            
            .maintenance-description {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="app-logo">🎲 UndiApp</div>
        
        <div class="gear-icon">⚙️</div>
        
        <h1 class="maintenance-title" id="maintenanceTitle">Pardon our dust!</h1>
        
        <p class="maintenance-description" id="maintenanceDescription">
            We are performing a quick system upgrade and should be back in a moment. Please check back shortly.
        </p>
        
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <p class="progress-text">System upgrade in progress...</p>
        </div>
        
        <div class="contact-info">
            <p>Need immediate assistance?</p>
            <a href="mailto:haris.illahi@gmail.com" class="contact-email" id="contactEmail">haris.illahi@gmail.com</a>
        </div>
        
        <div class="refresh-info">
            <p>⟳ This page will automatically refresh every 30 seconds</p>
        </div>
    </div>

    <script>
        // Auto-refresh every 30 seconds
        setTimeout(() => {
            window.location.reload();
        }, 30000);

        // Load maintenance config if available
        if (typeof MAINTENANCE_CONFIG !== 'undefined') {
            document.getElementById('maintenanceTitle').textContent = MAINTENANCE_CONFIG.message || 'Pardon our dust!';
            document.getElementById('maintenanceDescription').textContent = MAINTENANCE_CONFIG.description || 'We are performing a quick system upgrade and should be back in a moment. Please check back shortly.';
            
            if (MAINTENANCE_CONFIG.contact) {
                const contactEmail = document.getElementById('contactEmail');
                contactEmail.textContent = MAINTENANCE_CONFIG.contact;
                contactEmail.href = 'mailto:' + MAINTENANCE_CONFIG.contact;
            }
        }
    </script>
</body>
</html>
